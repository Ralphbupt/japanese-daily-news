# The podcast site: dist/ served as static assets by Cloudflare (no script), like jpnotes-site.
#   npm run build && npx wrangler deploy        (from site/; CI does this on every push: .github/workflows/deploy.yml)
# Requests for files are free and don't count against the Workers plan.
# dist/_redirects (from public/) is applied by Cloudflare: /audio/* → R2.
# Moved off Cloudflare Pages on 2026-11-18: the podcast CNAME to japanese-daily-news.pages.dev
# was deleted and the domain attached here; the Pages project was then deleted.
name = "podcast-site"
compatibility_date = "2026-09-01"
workers_dev = false         # true gives a podcast-site.<account>.workers.dev copy, for checks without touching the domain
routes = [{ pattern = "podcast.jpnotes.dev", custom_domain = true }]
preview_urls = false

[assets]
directory = "./dist"
# /ep/291 → /ep/291/ (served from ep/291/index.html), as on Pages.
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
